<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GORUT AUTH DEBUG v104</title>
<style>
body{font-family:Arial,sans-serif;background:#eef3f8;margin:0;padding:30px}.box{max-width:520px;margin:40px auto;background:#fff;padding:28px;border-radius:16px;box-shadow:0 10px 30px #0002}h1{font-size:22px}label{display:block;font-weight:700;font-size:13px;margin:14px 0 5px}input{width:100%;box-sizing:border-box;padding:11px;border:1px solid #ccd5df;border-radius:7px}button{width:100%;padding:12px;margin-top:18px;border:0;border-radius:8px;background:#1769aa;color:#fff;font-weight:700;cursor:pointer}#status{margin-top:15px;padding:12px;background:#f1f5f9;border-left:4px solid #1769aa;white-space:pre-wrap;word-break:break-word}.ok{background:#ecfdf5!important;border-left-color:#168c4b!important}.err{background:#fff1f2!important;border-left-color:#b42318!important}.small{font-size:12px;color:#64748b}
</style></head><body>
<div class="box"><div class="small">GORUT-OUTBREAK AI • AUTH DEBUG</div><h1>LOGIN TEST v104</h1>
<p class="small">Halaman ini sengaja tidak memakai app.js, sehingga kita bisa memisahkan masalah halaman utama dari Supabase.</p>
<label>Email</label><input id="email" type="email" autocomplete="username" value="">
<label>Kata sandi</label><input id="password" type="password" autocomplete="current-password">
<button id="btn" type="button">UJI LOGIN SUPABASE</button>
<div id="status">STATUS: Halaman JavaScript aktif. Silakan isi akun lalu tekan tombol.</div></div>
<script src="backend-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
 const s=document.getElementById('status'),b=document.getElementById('btn');
 function show(t,c){s.textContent=t;s.className=c||'';}
 b.addEventListener('click',async function(){
  b.disabled=true;b.textContent='MEMERIKSA...';show('v104: tombol berhasil diklik.','');
  try{
   const email=document.getElementById('email').value.trim().toLowerCase();
   const password=document.getElementById('password').value;
   if(!email||!password) throw new Error('Email dan kata sandi wajib diisi.');
   if(!window.GORUT_BACKEND||!window.GORUT_BACKEND.enabled) throw new Error('backend-config.js tidak termuat atau backend nonaktif.');
   if(!window.supabase) throw new Error('Library Supabase JS tidak termuat.');
   show('v104: Supabase library aktif. Menghubungkan...','');
   const client=window.supabase.createClient(window.GORUT_BACKEND.url,window.GORUT_BACKEND.anonKey);
   const result=await Promise.race([
    client.auth.signInWithPassword({email,password}),
    new Promise((_,reject)=>setTimeout(()=>reject(new Error('Timeout Supabase setelah 15 detik.')),15000))
   ]);
   if(result.error) throw result.error;
   show('v104: LOGIN BERHASIL\nUser ID: '+result.data.user.id+'\nEmail: '+(result.data.user.email||email),'ok');
  }catch(e){
   console.error(e);show('v104: LOGIN GAGAL\n'+(e&&e.message?e.message:String(e)),'err');b.disabled=false;b.textContent='UJI LOGIN SUPABASE';
  }
 });
})();
</script></body></html>
